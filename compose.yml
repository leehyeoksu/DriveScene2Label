services:
  db:
    # PostgreSQL 16 with pgvector (V2__image_embedding.sql runs CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivescene}
      POSTGRES_USER: ${POSTGRES_USER:-drivescene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Loopback only: for scripts/embed.sh, which runs on the host (venv) to use the local GPU.
    # A second Compose project (-p) must also set DB_PORT/APP_PORT/AI_PORT; the project name alone does not move ports.
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      # Catalog/camera/GT do not need a healthy CLIP; feature readiness comes from /api/system/status.
      ai-server:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-drivescene}
      DB_USERNAME: ${POSTGRES_USER:-drivescene}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      NUSCENES_ROOT: /data/nuscenes
      NUSCENES_VERSION: ${NUSCENES_VERSION:-v1.0-mini}
      NUSCENES_IMPORT_ENABLED: ${NUSCENES_IMPORT_ENABLED:-false}
      NUSCENES_DATA_ORIGIN: ${NUSCENES_DATA_ORIGIN:-UNKNOWN}
      AI_SERVER_BASE_URL: http://ai-server:8000
      AI_SERVER_READ_TIMEOUT: ${AI_SERVER_READ_TIMEOUT:-30s}
      VESPA_DATASET_VERSION: ${NUSCENES_VERSION:-v1.0-mini}
      AUTO_LABEL_READ_TIMEOUT: ${AUTO_LABEL_READ_TIMEOUT:-7300s}
      AUTO_LABEL_WORKER_ENABLED: ${AUTO_LABEL_WORKER_ENABLED:-true}
      VESPA_MODEL_VERSION: ${VESPA_MODEL_VERSION:-acb2b6e8683363795528f049fe0444ef9f3efdb9}
      VESPA_ARTIFACT_STORAGE_KEY: ${VESPA_ARTIFACT_STORAGE_KEY:-vespa-results}
      UPLOAD_ROOT: /data/uploads
      RECORDING_ROOT: /recordings
      RECORDING_WORKER_ENABLED: ${RECORDING_WORKER_ENABLED:-true}
      RECORDING_READ_TIMEOUT: ${RECORDING_READ_TIMEOUT:-660s}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${NUSCENES_HOST_PATH:-./data/nuscenes}
        target: /data/nuscenes
        read_only: true
        bind:
          create_host_path: true
      - dataset_uploads:/data/uploads
      # Rerun .rrd files written by ai-server; Spring only serves them.
      - type: volume
        source: rerun_recordings
        target: /recordings
        read_only: true

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/datasets"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  ai-server:
    build:
      context: .
      dockerfile: ai-server/Dockerfile
    environment:
      VESPA_DATASET_VERSION: ${NUSCENES_VERSION:-v1.0-mini}
      UPLOAD_ROOT: /data/uploads
      VESPA_NUM_THREADS: ${VESPA_NUM_THREADS:-1}
      VESPA_TIMEOUT_SECONDS: ${VESPA_TIMEOUT_SECONDS:-7200}
      RECORDING_TIMEOUT_SECONDS: ${RECORDING_TIMEOUT_SECONDS:-600}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${NUSCENES_HOST_PATH:-./data/nuscenes}
        target: /data/nuscenes
        read_only: true
        bind:
          create_host_path: true
      - dataset_uploads:/data/uploads:ro
      - model_cache:/models
      - vespa_results:/results
      - rerun_recordings:/recordings
    shm_size: 2gb

volumes:
  dataset_uploads:
  model_cache:
  vespa_results:
  postgres_data:
  rerun_recordings:
