spring.application.name=DriveScene2Label
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/drivescene}
spring.datasource.username=${DB_USERNAME:drivescene}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.sql.init.mode=never
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
nuscenes.root=${NUSCENES_ROOT:/data/nuscenes}
nuscenes.version=${NUSCENES_VERSION:v1.0-mini}
nuscenes.import.enabled=${NUSCENES_IMPORT_ENABLED:false}
server.error.include-message=always
embedding.model-name=${EMBEDDING_MODEL_NAME:ViT-L-14-quickgelu/openai}
embedding.preprocess=${EMBEDDING_PREPROCESS:lr-square-crop-mean}

# Spring -> AI server (host process defaults; Compose overrides this URL).
ai-server.base-url=${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
ai-server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:5s}
ai-server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}

auto-label.dataset-version=${VESPA_DATASET_VERSION:v1.0-trainval}
auto-label.model-version=${VESPA_MODEL_VERSION:acb2b6e8683363795528f049fe0444ef9f3efdb9}
auto-label.read-timeout=${AUTO_LABEL_READ_TIMEOUT:7300s}
auto-label.worker.enabled=${AUTO_LABEL_WORKER_ENABLED:true}
auto-label.artifact-storage-key=${VESPA_ARTIFACT_STORAGE_KEY:vespa-results}
